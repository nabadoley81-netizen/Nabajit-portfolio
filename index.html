<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nabajit Doley — Website Designer</title>

  <meta name="description" content="Nabajit Doley creates premium, responsive websites for businesses, restaurants, professionals and growing brands.">

  <meta name="theme-color" content="#0b0c0f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>

    :root {
      --black: #08090b;
      --dark: #0d0f12;
      --card: #12151a;
      --card-2: #171a20;
      --white: #f5f4ef;
      --muted: #969aa3;
      --muted-2: #6f747d;
      --line: rgba(255,255,255,.09);
      --blue: #6ea8ff;
      --blue-bright: #8bb9ff;
      --green: #75e0a0;

      --heading: "Manrope", sans-serif;
      --body: "DM Sans", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    html {
      background: var(--black);
    }

    body {
      background:
        radial-gradient(circle at 75% 5%, rgba(73,121,201,.12), transparent 25%),
        radial-gradient(circle at 15% 30%, rgba(255,255,255,.035), transparent 22%),
        var(--black);
      color: var(--white);
      font-family: var(--body);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::selection {
      background: var(--blue);
      color: #07101f;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(1160px, 90%);
      margin: auto;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .nav-wrap {
      position: fixed;
      top: 18px;
      left: 0;
      width: 100%;
      z-index: 999;
      pointer-events: none;
    }

    nav {
      width: min(1120px, 92%);
      margin: auto;
      min-height: 66px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 10px 0 20px;

      background: rgba(13,15,18,.76);
      border: 1px solid var(--line);
      border-radius: 18px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow: 0 18px 50px rgba(0,0,0,.25);

      pointer-events: auto;
    }

    .brand {
      font-family: var(--heading);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.7px;
    }

    .brand span {
      color: var(--blue);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
    }

    .nav-links a {
      color: #bfc2c8;
      font-size: 13px;
      font-weight: 600;
      transition: .25s ease;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-project {
      background: var(--white);
      color: #08090b !important;
      padding: 11px 17px;
      border-radius: 11px;
    }

    .nav-project:hover {
      background: var(--blue-bright);
    }

    .menu-btn {
      display: none;
      border: 1px solid var(--line);
      color: white;
      background: #15181d;
      border-radius: 10px;
      padding: 9px 11px;
      cursor: pointer;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      padding: 150px 0 100px;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: rgba(77,132,222,.09);
      filter: blur(100px);
      top: 5%;
      right: -10%;
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 70px;
      align-items: end;
    }

    .availability {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      border-radius: 100px;

      padding: 8px 13px;
      margin-bottom: 27px;

      color: #bfc2c8;
      font-size: 12px;
      font-weight: 600;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(117,224,160,.6);
    }

    h1 {
      font-family: var(--heading);
      font-size: clamp(52px, 8vw, 104px);
      line-height: .96;
      letter-spacing: -5px;
      font-weight: 800;
      max-width: 900px;
    }

    h1 .dim {
      color: #70747d;
    }

    h1 .blue {
      color: var(--blue);
    }

    .hero-description {
      color: var(--muted);
      max-width: 590px;
      font-size: 18px;
      margin: 28px 0 32px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;

      padding: 14px 20px;
      border-radius: 12px;

      border: 1px solid var(--line);

      font-size: 14px;
      font-weight: 700;

      transition: transform .25s ease,
                  background .25s ease,
                  border .25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: var(--white);
      color: #08090b;
      border-color: var(--white);
    }

    .btn-primary:hover {
      background: var(--blue-bright);
      border-color: var(--blue-bright);
    }

    .btn-dark {
      background: rgba(255,255,255,.035);
      color: white;
    }

    .btn-dark:hover {
      border-color: rgba(255,255,255,.22);
      background: rgba(255,255,255,.07);
    }

    .hero-side {
      padding-bottom: 7px;
    }

    .hero-side-line {
      width: 100%;
      height: 1px;
      background: var(--line);
      margin-bottom: 20px;
    }

    .hero-side p {
      color: var(--muted-2);
      font-size: 13px;
      max-width: 280px;
    }

    /* =========================
       GLOBAL SECTIONS
    ========================= */

    section {
      padding: 120px 0;
      border-top: 1px solid var(--line);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      font-weight: 800;
      color: var(--blue);
      margin-bottom: 15px;
    }

    .section-title {
      font-family: var(--heading);
      font-size: clamp(38px, 5.5vw, 68px);
      line-height: 1.02;
      letter-spacing: -3px;
      font-weight: 800;
    }

    .section-description {
      color: var(--muted);
      max-width: 650px;
      margin-top: 20px;
      font-size: 16px;
    }

    /* =========================
       SELECTED WORK
    ========================= */

    .work-header {
      display: flex;
      justify-content: space-between;
      gap: 40px;
      align-items: end;
      margin-bottom: 55px;
    }

    .work-link {
      color: #aaaeb6;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .projects {
      display: grid;
      gap: 35px;
    }

    .project {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      min-height: 500px;

      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 25px;
      overflow: hidden;

      transition: transform .35s ease,
                  border-color .35s ease;
    }

    .project:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,.17);
    }

    .project-visual {
      min-height: 500px;
      padding: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 50% 40%, rgba(99,157,255,.2), transparent 28%),
        linear-gradient(145deg,#1a2432,#0b0d10);
    }

    .browser {
      width: 88%;
      border-radius: 13px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      background: #0b0d10;
      box-shadow: 0 35px 80px rgba(0,0,0,.5);
      transform: rotate(-2deg);
      transition: transform .5s ease;
    }

    .project:hover .browser {
      transform: rotate(0deg) scale(1.025);
    }

    .browser-top {
      height: 31px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding-left: 11px;
      background: #15181d;
    }

    .browser-top i {
      width: 6px;
      height: 6px;
      background: #4d5158;
      border-radius: 50%;
    }

    .browser-screen {
      min-height: 310px;
      padding: 35px;

      background:
        linear-gradient(145deg, #20252d, #101216);
    }

    .screen-small {
      width: 70px;
      height: 7px;
      background: #687080;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    .screen-title {
      width: 75%;
      height: 27px;
      background: #f0f0ec;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    .screen-title.two {
      width: 48%;
      background: #8baee1;
    }

    .screen-text {
      width: 58%;
      height: 6px;
      background: #555d69;
      border-radius: 10px;
      margin-top: 22px;
    }

    .project-info {
      padding: 50px 42px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .project-number {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .project-info h3 {
      font-family: var(--heading);
      font-size: 35px;
      line-height: 1.05;
      letter-spacing: -1.5px;
      margin-bottom: 15px;
    }

    .project-info p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .tag {
      display: inline-block;
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 100px;
      padding: 6px 10px;
      color: #9da2ab;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .7px;
      margin-bottom: 25px;
    }

    /* =========================
       BIG STATEMENT
    ========================= */

    .statement {
      min-height: 65vh;
      display: flex;
      align-items: center;
    }

    .statement h2 {
      font-family: var(--heading);
      font-size: clamp(43px, 7vw, 88px);
      line-height: .99;
      letter-spacing: -4px;
      max-width: 1050px;
    }

    .statement h2 span {
      color: #6f747d;
    }

    /* =========================
       SERVICES
    ========================= */

    .service-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      margin-top: 55px;
      border-top: 1px solid var(--line);
    }

    .service {
      padding: 35px 25px 35px 0;
      border-bottom: 1px solid var(--line);
    }

    .service:nth-child(even) {
      padding-left: 35px;
      border-left: 1px solid var(--line);
    }

    .service-number {
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .service h3 {
      font-family: var(--heading);
      font-size: 25px;
      letter-spacing: -.8px;
      margin-bottom: 9px;
    }

    .service p {
      color: var(--muted);
      max-width: 460px;
      font-size: 14px;
    }

    /* =========================
       PROCESS
    ========================= */

    .process-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      margin-top: 55px;
      gap: 12px;
    }

    .process-card {
      min-height: 240px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 27px;
      transition: .3s ease;
    }

    .process-card:hover {
      background: var(--card-2);
      transform: translateY(-4px);
    }

    .process-card strong {
      display: block;
      color: #5f6570;
      font-size: 12px;
      margin-bottom: 55px;
    }

    .process-card h3 {
      font-family: var(--heading);
      font-size: 21px;
      margin-bottom: 8px;
    }

    .process-card p {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       OWNERSHIP
    ========================= */

    .ownership {
      background:
        radial-gradient(circle at 80% 50%, rgba(78,137,227,.12), transparent 30%),
        #0d0f12;
    }

    .ownership-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .ownership-text p {
      color: var(--muted);
      max-width: 550px;
      margin-top: 20px;
    }

    .ownership-points {
      display: grid;
      gap: 12px;
    }

    .ownership-point {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      border-radius: 14px;
      padding: 20px;
    }

    .ownership-point strong {
      display: block;
      margin-bottom: 5px;
    }

    .ownership-point span {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       ABOUT
    ========================= */

    .about-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 100px;
      align-items: start;
    }

    .about-big {
      font-family: var(--heading);
      font-size: clamp(65px,10vw,130px);
      line-height: .8;
      font-weight: 800;
      letter-spacing: -8px;
      color: #22262d;
    }

    .about-content p {
      color: #a8acb4;
      font-size: 17px;
      max-width: 650px;
      margin-bottom: 20px;
    }

    .about-note {
      margin-top: 35px;
      border-left: 2px solid var(--blue);
      padding-left: 18px;
      color: #d0d3d8;
      font-weight: 600;
    }

    /* =========================
       WHY
    ========================= */

    .why-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      margin-top: 55px;
      gap: 12px;
    }

    .why-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 27px;
      background: var(--card);
    }

    .why-icon {
      color: var(--blue);
      font-size: 21px;
      margin-bottom: 35px;
    }

    .why-card h3 {
      font-family: var(--heading);
      font-size: 19px;
      margin-bottom: 8px;
    }

    .why-card p {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       FAQ
    ========================= */

    .faq {
      max-width: 850px;
      margin-top: 45px;
    }

    details {
      border-top: 1px solid var(--line);
      padding: 23px 0;
    }

    details:last-child {
      border-bottom: 1px solid var(--line);
    }

    summary {
      cursor: pointer;
      list-style: none;
      font-family: var(--heading);
      font-weight: 700;
      font-size: 16px;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";
      float: right;
      color: var(--blue);
      font-size: 20px;
    }

    details[open] summary::after {
      content: "−";
    }

    details p {
      color: var(--muted);
      padding-top: 15px;
      max-width: 700px;
      font-size: 14px;
    }

    /* =========================
       CTA
    ========================= */

    .final-cta {
      text-align: center;
      padding: 150px 0;
    }

    .final-cta .section-title {
      max-width: 900px;
      margin: auto;
    }

    .final-cta p {
      color: var(--muted);
      max-width: 560px;
      margin: 20px auto 30px;
    }

    .final-buttons {
      justify-content: center;
    }

    /* =========================
       CONTACT
    ========================= */

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
      margin-top: 50px;
    }

    .contact-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 30px;
    }

    .contact-card small {
      color: var(--blue);
      font-weight: 800;
      font-size: 10px;
      letter-spacing: 1.4px;
    }

    .contact-card h3 {
      font-family: var(--heading);
      font-size: 22px;
      margin: 18px 0 7px;
    }

    .contact-card p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid var(--line);
      padding: 45px 0;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      margin-bottom: 40px;
    }

    .footer-brand {
      font-family: var(--heading);
      font-weight: 800;
      font-size: 20px;
    }

    .footer-brand span {
      color: var(--blue);
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      color: #8c9199;
      font-size: 12px;
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: #60656d;
      font-size: 11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .nav-wrap {
        top: 10px;
      }

      nav {
        min-height: 62px;
        border-radius: 15px;
      }

      .menu-btn {
        display: block;
      }

      .nav-links {
        display: none;

        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;

        flex-direction: column;
        align-items: stretch;
        gap: 0;

        background: rgba(13,15,18,.97);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 13px;

        backdrop-filter: blur(18px);
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        padding: 13px;
      }

      .nav-project {
        text-align: center;
        margin-top: 5px;
      }

      .hero {
        padding-top: 140px;
      }

      .hero-grid,
      .project,
      .ownership-grid,
      .about-grid {
        grid-template-columns: 1fr;
      }

      .hero-grid {
        gap: 50px;
      }

      h1 {
        letter-spacing: -3px;
      }

      .hero-side {
        display: none;
      }

      section {
        padding: 85px 0;
      }

      .work-header {
        display: block;
        margin-bottom: 35px;
      }

      .work-link {
        display: inline-block;
        margin-top: 20px;
      }

      .project-visual {
        min-height: 350px;
      }

      .browser {
        width: 92%;
      }

      .browser-screen {
        min-height: 230px;
        padding: 25px;
      }

      .project-info {
        padding: 35px 27px;
      }

      .project-info h3 {
        font-size: 30px;
      }

      .service-grid {
        grid-template-columns: 1fr;
      }

      .service,
      .service:nth-child(even) {
        padding: 28px 0;
        border-left: 0;
      }

      .process-grid,
      .why-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .about-grid {
        gap: 45px;
      }

      .about-big {
        font-size: 85px;
      }

      .ownership-grid {
        gap: 45px;
      }

      .footer-top,
      .footer-bottom {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-links {
        flex-wrap: wrap;
      }

      .final-cta {
        padding: 100px 0;
      }
    }

    @media (max-width: 480px) {

      .container {
        width: 88%;
      }

      h1 {
        font-size: 50px;
      }

      .section-title {
        letter-spacing: -2px;
      }

      .hero-buttons .btn {
        width: 100%;
      }

      .project-visual {
        padding: 15px;
      }

      .browser-screen {
        min-height: 190px;
      }

      .screen-title {
        height: 20px;
      }

      .final-buttons .btn {
        width: 100%;
      }
    }

  </style>
</head>

<body>

  <!--
