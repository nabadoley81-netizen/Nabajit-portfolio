<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2, h3 { border-bottom: 2px solid #0070f3; padding-bottom: 5px; margin-top: 30px; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, textarea, button { width: 100%; padding: 10px; margin: 6px 0 15px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { background: #0070f3; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #0051a8; }
    .hidden { display: none; }
    .logout-btn { background: #dc3545; margin-top: 20px; }
    .logout-btn:hover { background: #a71d2a; }
    .cancel-btn { background: #6c757d; }
    
    .project-item { display: flex; align-items: center; justify-content: space-between; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-top: 10px; background: #fafafa; }
    .project-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; margin-right: 10px; }
    .project-info { flex-grow: 1; margin-right: 10px; }
    .project-actions { display: flex; gap: 5px; width: 140px; }
    .edit-btn { background: #ffc107; color: #000; padding: 6px 10px; font-size: 13px; }
    .delete-btn { background: #dc3545; padding: 6px 10px; font-size: 13px; }
    .section-card { background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #eee; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <div id="login-section">
    <h2>Admin Login</h2>
    <input type="email" id="login-email" placeholder="Email Address">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="handleLogin()">Login</button>
    <p id="login-msg" style="color: red;"></p>
  </div>

  <div id="dashboard-section" class="hidden">
    <h1>Portfolio Admin Panel</h1>

    <h2>1. Edit Website Text & Content</h2>
    
    <div class="section-card">
      <h3>Hero Section</h3>
      <label>Main Title Heading:</label>
      <input type="text" id="setting-hero_title">
      
      <label>Subtitle / Description:</label>
      <textarea id="setting-hero_subtitle" rows="3"></textarea>

      <label>WhatsApp Number (e.g. 919876543210):</label>
      <input type="text" id="setting-whatsapp_number">

      <label>Phone Call Number:</label>
      <input type="text" id="setting-phone_number">
    </div>

    <div class="section-card">
      <h3>About & Philosophy</h3>
      <label>Philosophy Title:</label>
      <input type="text" id="setting-philosophy_title">
      <label>Philosophy Description:</label>
      <textarea id="setting-philosophy_desc" rows="3"></textarea>

      <label>About Me Title:</label>
      <input type="text" id="setting-about_title">
      <label>About Me Bio:</label>
      <textarea id="setting-about_bio" rows="4"></textarea>
    </div>

    <button onclick="saveSiteSettings()" style="background: #28a745;">💾 Save Site Text</button>

    <h2>2. Manage Projects</h2>
    <div class="section-card">
      <h3 id="form-title">Add New Project</h3>
      <input type="hidden" id="edit-project-id">
      
      <label>Project Title:</label>
      <input type="text" id="title" placeholder="Project Title">
      
      <label>Description:</label>
      <textarea id="description" placeholder="Project Description"></textarea>
      
      <label>Image URL:</label>
      <input type="text" id="image-url" placeholder="Image URL">
      
      <label>Category / Tag:</label>
      <input type="text" id="category" placeholder="e.g. Web Design / Concept">
      
      <label>Live Demo Link:</label>
      <input type="text" id="project-url" placeholder="https://...">

      <button id="submit-btn" onclick="saveProject()">Add Project</button>
      <button id="cancel-btn" class="cancel-btn hidden" onclick="resetProjectForm()">Cancel Edit</button>
    </div>

    <h3>Existing Projects List</h3>
    <div id="projects-list">Loading projects...</div>

    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://pawjocmgkduixthttiyf.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VDrrsXorS0n0j-4AqQEZkg_Dq3Zr2jn';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function checkUser() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (user) {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      loadSiteSettings();
      loadProjectsList();
    }
  }
  checkUser();

  async function handleLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const msg = document.getElementById('login-msg');

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) { msg.innerText = error.message; } else { location.reload(); }
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    location.reload();
  }

  async function loadSiteSettings() {
    const { data } = await supabaseClient.from('site_settings').select('*');
    if (data) {
      data.forEach(item => {
        const input = document.getElementById(`setting-${item.key}`);
        if (input) input.value = item.value;
      });
    }
  }

  async function saveSiteSettings() {
    const keys = ['hero_title', 'hero_subtitle', 'whatsapp_number', 'phone_number', 'philosophy_title', 'philosophy_desc', 'about_title', 'about_bio'];
    const updates = keys.map(key => ({
      key: key,
      value: document.getElementById(`setting-${key}`).value || ''
    }));

    const { error } = await supabaseClient.from('site_settings').upsert(updates);
    if (error) alert('Error saving settings: ' + error.message);
    else alert('Site text updated successfully!');
  }

  async function loadProjectsList() {
    const listDiv = document.getElementById('projects-list');
    const { data: projects, error } = await supabaseClient.from('project').select('*');

    if (error || !projects || projects.length === 0) {
      listDiv.innerHTML = '<p>No projects found.</p>';
      return;
    }

    listDiv.innerHTML = '';
    projects.forEach(p => {
      const item = document.createElement('div');
      item.className = 'project-item';
      item.innerHTML = `
        <img src="${p.image_url || 'https://via.placeholder.com/50'}" alt="thumb">
        <div class="project-info">
          <strong>${p.title}</strong><br>
          <small>${p.category || 'General'}</small>
        </div>
        <div class="project-actions">
          <button class="edit-btn" onclick='prepareEdit(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Edit</button>
          <button class="delete-btn" onclick="deleteProject(${p.id})">Delete</button>
        </div>
      `;
      listDiv.appendChild(item);
    });
  }

  async function saveProject() {
    const id = document.getElementById('edit-project-id').value;
    const title = document.getElementById('title').value;
    const description = document.getElementById('description').value;
    const image_url = document.getElementById('image-url').value;
    const category = document.getElementById('category').value;
    const project_url = document.getElementById('project-url').value;

    if (!title) return alert('Please enter a project title');

    let error;
    if (id) {
      const res = await supabaseClient.from('project').update({ title, description, image_url, category, project_url }).eq('id', id);
      error = res.error;
    } else {
      const res = await supabaseClient.from('project').insert([{ title, description, image_url, category, project_url }]);
      error = res.error;
    }

    if (error) alert('Error: ' + error.message);
    else {
      alert(id ? 'Project updated!' : 'Project added!');
      resetProjectForm();
      loadProjectsList();
    }
  }

  function prepareEdit(project) {
    document.getElementById('edit-project-id').value = project.id;
    document.getElementById('title').value = project.title || '';
    document.getElementById('description').value = project.description || '';
    document.getElementById('image-url').value = project.image_url || '';
    document.getElementById('category').value = project.category || '';
    document.getElementById('project-url').value = project.project_url || '';

    document.getElementById('form-title').innerText = 'Edit Project';
    document.getElementById('submit-btn').innerText = 'Update Project';
    document.getElementById('cancel-btn').classList.remove('hidden');
  }

  function resetProjectForm() {
    document.getElementById('edit-project-id').value = '';
    document.getElementById('title').value = '';
    document.getElementById('description').value = '';
    document.getElementById('image-url').value = '';
    document.getElementById('category').value = '';
    document.getElementById('project-url').value = '';

    document.getElementById('form-title').innerText = 'Add New Project';
    document.getElementById('submit-btn').innerText = 'Add Project';
    document.getElementById('cancel-btn').classList.add('hidden');
  }

  async function deleteProject(id) {
    if (!confirm('Are you sure you want to delete this project?')) return;
    const { error } = await supabaseClient.from('project').delete().eq('id', id);
    if (error) alert('Error: ' + error.message);
    else { alert('Deleted!'); loadProjectsList(); }
  }
</script>

</body>
</html>
